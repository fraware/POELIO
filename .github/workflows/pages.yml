# POELIO public teaching experience only. Never distribute private La Relève.
#
# An exact successful main-branch source CI run is a prerequisite, and the
# completed SHA must still be current main. GitHub Pages activation (Settings >
# Pages > Source: GitHub Actions) is an independent repository-admin setting.
name: Publish public reading preview
on:
  workflow_run:
    workflows:
      - Public source CI
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: poelio-pages-public-preview
  cancel-in-progress: false

jobs:
  build:
    outputs:
      public_manifest_b64: ${{ steps.export_manifest.outputs.public_manifest_b64 }}
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out the exact CI-green main commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Validate provenance against current main
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "${EXPECTED_SHA}" = "${CURRENT_SHA}"
          test "$(git rev-parse HEAD)" = "${EXPECTED_SHA}"
          test ! -e experience/catalog.json
          test ! -e experience/private-runtime
          test ! -e experience/private-dist
      - name: Use locked Node toolchain
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install exactly locked dependencies, without lifecycle scripts
        run: npm ci --prefix experience --ignore-scripts --no-audit --no-fund
      - name: Audit full public application dependency tree
        run: npm audit --prefix experience --audit-level=high --no-fund
      - name: Verify original public sources and build for /POELIO/
        run: npm --prefix experience run build:subpath
      - name: Audit the exact eight public website files
        run: |
          set -euo pipefail
          npm --prefix experience run audit:subpath
          test "$(find experience/dist -type f | wc -l)" -eq 8
          test ! -e experience/dist/catalog.json
          test ! -e experience/dist/private-runtime
          test ! -e experience/dist/private-dist
      - name: Export exact audited public-file evidence to deployment verifier
        id: export_manifest
        run: |
          set -euo pipefail
          test -s experience/release-audit/subpath.json
          echo "public_manifest_b64=$(base64 -w0 experience/release-audit/subpath.json)" >> "$GITHUB_OUTPUT"
      - name: Upload GitHub Pages site without unrelated repository files
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: experience/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Reject stale publish if main changed during the build
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          CURRENT_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "${EXPECTED_SHA}" = "${CURRENT_SHA}"
      - name: Read GitHub Pages site configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish only the audited public teaching site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Check out the exact live-site auditor source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - name: Use pinned Node toolchain for public-site check
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Verify live GitHub Pages against all eight audited public file digests
        env:
          POELIO_PUBLIC_SITE_URL: ${{ steps.deployment.outputs.page_url }}
          POELIO_PUBLIC_MANIFEST_B64: ${{ needs.build.outputs.public_manifest_b64 }}
        run: node experience/scripts/verify_live_public_site.mjs
