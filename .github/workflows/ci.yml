name: Public source CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install exactly locked root dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit full locked root dependency tree
        run: npm audit --audit-level=high --no-fund
      - name: Typecheck, compile and exhaustive model tests
        run: npm test
      - name: Verify private importer with synthetic literary fixtures only
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify editorial documentation, licensing and links
        run: python3 tools/check_docs.py
      - name: Verify repository filename embargo
        run: python3 scripts/check_public.py
      - name: Build publication-safe mathematical demo
        run: python3 scripts/build_public.py
      - name: Verify public output allowlist
        run: |
          test "$(find dist -type f | wc -l)" -eq 4
          test ! -e dist/catalog.json
  literary-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
      - name: Install exactly locked experience dependencies
        run: npm ci --prefix experience --ignore-scripts --no-audit --no-fund
      - name: Audit installed public-runtime dependencies for high-severity advisories
        run: npm audit --prefix experience --omit=dev --audit-level=high --no-fund
      - name: Audit full locked literary-app dependency tree
        run: npm audit --prefix experience --audit-level=high --no-fund
      - name: Typecheck, model/content contract tests and Vite build
        run: |
          npm --prefix experience run typecheck
          npm --prefix experience test
          npm --prefix experience run build
      - name: Reject unexpected output files
        run: |
          find experience/dist -type f | sort
          test ! -e experience/dist/catalog.json
          test ! -e experience/dist/private-runtime
          test "$(find experience/dist -type f | wc -l)" -eq 8
          test -f experience/dist/sw.js
          ! grep -R -E 'Mardi, une clé en soulevait|Lundi, l.enveloppe reposait' experience/dist
      - name: Strict offline build allowlist tests
        run: npm --prefix experience run test:offline
      - name: Test hardened hosted HTTP response contract (synthetic only)
        run: npm --prefix experience run test:host-headers
      - name: Test fail-closed release evidence auditor
        run: npm --prefix experience run test:release
      - name: Test fail-closed release candidate evidence comparison
        run: npm --prefix experience run test:compare
      - name: Audit exact approved root-build bytes and source pins
        run: npm --prefix experience run audit:root
      - name: Archive approved public demo for local review
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: poelio-approved-offline-demo
          path: experience/dist/
          if-no-files-found: error
          retention-days: 14
      - name: Install headless Chromium
        run: npx --prefix experience playwright install chromium --with-deps
      - name: Desktop and mobile browser journey
        run: npm --prefix experience run test:e2e
      - name: Archive browser screenshots for human design review
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: poelio-editorial-visual-review
          path: experience/visual-review/
          if-no-files-found: error
          retention-days: 14
      - name: Build approved public app at a non-root /POELIO/ path
        run: npm --prefix experience run build:subpath
      - name: Audit exact approved repository-subpath build bytes
        run: npm --prefix experience run audit:subpath
      - name: Compare public provenance and dependencies across both deployment layouts
        run: npm --prefix experience run compare:variants
      - name: Verify subpath build and offline navigation in desktop/mobile Chromium
        run: npm --prefix experience run test:subpath
      - name: Archive technical-only release evidence (not publication authorization)
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: poelio-public-technical-release-evidence
          path: experience/release-audit/
          if-no-files-found: error
          retention-days: 14
