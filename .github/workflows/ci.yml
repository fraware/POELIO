name: Public source CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned TypeScript
        run: npm install --ignore-scripts --no-audit --no-fund --no-save
      - name: Typecheck, compile and exhaustive model tests
        run: npm test
      - name: Verify repository filename embargo
        run: python3 scripts/check_public.py
      - name: Build publication-safe mathematical demo
        run: python3 scripts/build_public.py
      - name: Verify public output allowlist
        run: |
          test "$(find dist -type f | wc -l)" -eq 4
          test ! -e dist/catalog.json
