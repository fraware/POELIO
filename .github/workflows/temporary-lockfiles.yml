name: Temporary lockfile generation
on:
  push:
    branches:
      - feat/public-literary-content-registry
    paths:
      - .github/workflows/temporary-lockfiles.yml
permissions:
  contents: write
jobs:
  lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate root and experience dependency locks without executing install scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix experience --package-lock-only --ignore-scripts --no-audit --no-fund
          node -e "const x=require('./package-lock.json');const y=require('./experience/package-lock.json');if(x.lockfileVersion!==3||y.lockfileVersion!==3)process.exit(1)"
      - name: Commit lockfiles only onto dedicated feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- package-lock.json experience/package-lock.json
          git diff --cached --quiet && exit 0
          git commit -m "build: lock root and experience transitive dependencies"
          git push origin HEAD:feat/public-literary-content-registry
