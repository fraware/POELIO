<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title description">
  <title id="title">POELIO, an explorable literary atelier</title>
  <desc id="description">An editorial book-cover composition in forest green and ivory, with an abstract constellation of six literary stages.</desc>
  <rect width="1200" height="420" fill="#18271f"/>
  <rect x="29" y="28" width="1142" height="364" rx="2" fill="none" stroke="#b5ad89" stroke-opacity=".6"/>
  <path d="M 63 83 L 1137 83 M 63 338 L 1137 338" stroke="#a7ac91" stroke-opacity=".48"/>
  <path d="M 820 117 L 820 302" stroke="#b5ad89" stroke-opacity=".3"/>
  <text x="78" y="65" font-size="13" font-family="Georgia,serif" letter-spacing="5" fill="#c5ccb9">UNE BIBLIOTHÈQUE DES POSSIBLES</text>
  <text x="74" y="222" font-size="112" font-family="Georgia, 'Times New Roman', serif" letter-spacing="9" fill="#f0ead9">POELIO</text>
  <text x="79" y="262" font-family="Georgia,serif" font-style="italic" font-size="25" fill="#d0d0b1">Lire les formes. Habiter les possibles.</text>
  <text x="80" y="367" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="2.5" fill="#c9cfbd">LIRE  ·  QUESTIONNER  ·  EXPLORER  ·  COMPARER  ·  INVENTER  ·  REVENIR</text>
  <g stroke="#e2d8b8" stroke-width="1.5" fill="none">
    <path d="M 915 217 C 935 169 984 171 1007 215 C 1036 271 1085 260 1110 202" stroke-opacity=".65"/>
    <path d="M 915 217 C 938 264 986 269 1007 215 C 1030 165 1078 160 1110 202" stroke-opacity=".45"/>
    <circle cx="915" cy="217" r="9" fill="#e2d8b8"/>
    <circle cx="949" cy="191" r="6" fill="#18271f"/>
    <circle cx="983" cy="181" r="6" fill="#18271f"/>
    <circle cx="1007" cy="215" r="9" fill="#e2d8b8"/>
    <circle cx="1062" cy="251" r="6" fill="#18271f"/>
    <circle cx="1110" cy="202" r="9" fill="#e2d8b8"/>
    <circle cx="1007" cy="215" r="75" stroke-opacity=".19"/>
    <circle cx="1007" cy="215" r="113" stroke-opacity=".12"/>
  </g>
  <text x="872" y="315" font-family="Georgia,serif" font-size="16" letter-spacing="2" fill="#c7c4a6">THE OPEN PAGE</text>
</svg>
